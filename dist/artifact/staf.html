<title>SPRINT · Stafi</title>
<style>
/* ============================================================================
   SPRINT — Hyrja e stafit.
   Një link i vetëm për të gjithë. Kodi vendos se çfarë sheh njeriu pas tij:
   kuzhinieri sheh furrën, motorristi sheh nisjen, pronari sheh të dyja.
   ========================================================================== */
:root{
  --brand:#DE7F1C; --gold:#FFC244;
  --bg:#0A0908; --pan:#161211; --pan-2:#1F1917; --pan-3:#2A2220;
  --txt:#F7F1E7; --muted:#9C9089; --line:rgba(255,255,255,.12);
  --ok:#4CAF6D; --warn:#E6B23C; --bad:#E5544B;
  --display:'Bakbak One',Impact,Haettenschweiler,sans-serif;
  --body:system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--body);
  font-size:17px;line-height:1.4;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--gold)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hide{display:none!important}

/* ---------- hyrja ---------- */
#gate{min-height:100dvh;display:grid;place-items:center;padding:1.5rem}
.gate-card{width:min(100%,380px);display:grid;gap:1.1rem;text-align:center}
.logo{font-family:var(--display);font-size:2.4rem;letter-spacing:.02em}
.logo em{font-style:normal;color:var(--brand)}
.gate-sub{color:var(--muted);margin:0;font-size:.95rem}
#pinShow{font-family:ui-monospace,monospace;font-size:2.6rem;letter-spacing:.55em;
  height:4rem;display:grid;place-items:center;background:var(--pan);
  border:2px solid var(--line);border-radius:16px;padding-left:.55em}
#pinShow.err{border-color:var(--bad);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}
.keys button{background:var(--pan);border:1.5px solid var(--line);border-radius:16px;
  padding:1.1rem;font-size:1.6rem;font-weight:600;transition:.12s}
.keys button:active{background:var(--brand);color:#1B0D02;transform:scale(.96)}
.keys .go{background:var(--brand);color:#1B0D02;border-color:var(--brand)}
.gate-err{color:#ff9a92;font-size:.9rem;min-height:1.3em;margin:0}
.gate-card .code{font-family:ui-monospace,monospace;letter-spacing:.14em;color:var(--txt)}

/* ---------- shiriti ---------- */
header{position:sticky;top:0;z-index:20;background:rgba(10,9,8,.96);
  border-bottom:1px solid var(--line);padding:.55rem clamp(.7rem,2vw,1.2rem);
  display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
header .logo{font-size:1.4rem}
.who{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  border:1px solid var(--line);border-radius:999px;padding:.3rem .7rem;white-space:nowrap}
.switch{display:flex;gap:.3rem;background:var(--pan-2);border-radius:12px;padding:.22rem}
.switch button{padding:.42rem .85rem;border-radius:9px;font-size:.84rem;font-weight:600;
  color:var(--muted);transition:.15s;white-space:nowrap}
.switch button.on{background:var(--brand);color:#1B0D02}
.hact{display:flex;gap:.5rem;margin-left:auto;align-items:center;flex-wrap:wrap}
.cbadge{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  border:1px solid var(--line);border-radius:999px;padding:.3rem .7rem;white-space:nowrap}
.cbadge b{color:var(--gold);font-size:.9rem}
.hbtn{border:1.5px solid var(--line);border-radius:11px;padding:.45rem .8rem;font-size:.82rem;font-weight:600}
.hbtn:hover{border-color:var(--gold);color:var(--gold)}
.hbtn.off{opacity:.45}

#offline{position:fixed;top:0;left:0;right:0;background:var(--bad);color:#fff;
  text-align:center;padding:.4rem;font-size:.85rem;font-weight:600;z-index:50;
  transform:translateY(-100%);transition:transform .25s}
#offline.on{transform:none}
.empty{text-align:center;color:var(--muted);padding:4rem 1rem;font-size:1.05rem}

/* ══════════════════ KUZHINA ══════════════════ */
#v-kds{padding:clamp(.7rem,2vw,1.2rem);display:grid;gap:.9rem;
  grid-template-columns:repeat(auto-fill,minmax(290px,1fr));align-content:start}
#v-kds .empty{grid-column:1/-1}
.tick{background:var(--pan);border:2px solid var(--line);border-radius:18px;
  display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;transition:border-color .25s}
.tick.s-new{border-style:dashed;opacity:.62}
.tick.warn{border-color:var(--warn)}
.tick.late{border-color:var(--bad);animation:pulse 1.6s infinite}
@keyframes pulse{50%{border-color:rgba(229,84,75,.35)}}
.t-hd{display:flex;align-items:center;gap:.6rem;padding:.6rem .85rem;
  background:var(--pan-2);border-bottom:1px solid var(--line)}
.t-no{font-family:var(--display);font-size:1.7rem;line-height:1}
.t-kind{font-size:.66rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  border:1px solid currentColor;border-radius:999px;padding:.2rem .5rem;color:var(--muted)}
.t-kind.pick{color:var(--gold)}
.t-clock{margin-left:auto;font-family:ui-monospace,monospace;font-size:1.5rem;font-weight:700;
  font-variant-numeric:tabular-nums}
.tick.warn .t-clock{color:var(--warn)}
.tick.late .t-clock{color:var(--bad)}
.t-items{padding:.7rem .85rem;display:grid;gap:.5rem;align-content:start}
.t-line{display:grid;grid-template-columns:auto 1fr;gap:.65rem;align-items:baseline;
  font-size:1.15rem;line-height:1.3;cursor:pointer;user-select:none}
.t-line .q{font-family:var(--display);font-size:1.3rem;color:var(--gold);min-width:1.6rem}
.t-line.done{opacity:.38;text-decoration:line-through}
.t-note{margin:.2rem 0 0;background:rgba(230,178,60,.14);border-left:3px solid var(--warn);
  border-radius:0 8px 8px 0;padding:.45rem .6rem;font-size:1rem;color:#f4dca6}
.t-act{display:grid;grid-template-columns:1fr auto;gap:.5rem;padding:.7rem .85rem;
  border-top:1px solid var(--line)}
.big{border-radius:14px;padding:1rem;font-size:1.15rem;font-weight:700;letter-spacing:.02em;
  transition:.15s;text-align:center}
.big:active{transform:scale(.97)}
.b-start{background:var(--brand);color:#1B0D02}
.b-ready{background:var(--ok);color:#052312}
.b-back{border:1.5px solid var(--line);color:var(--muted);padding:1rem .9rem;border-radius:14px;font-size:1.2rem}
.b-back:hover{border-color:var(--gold);color:var(--gold)}

#undo{position:fixed;left:50%;bottom:1.1rem;transform:translateX(-50%) translateY(220%);
  background:var(--pan-2);border:1.5px solid var(--gold);border-radius:14px;
  padding:.75rem 1.1rem;display:flex;gap:.9rem;align-items:center;z-index:40;
  transition:transform .25s;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#undo.on{transform:translateX(-50%)}
#undo b{color:var(--gold)}
#undo button{border:1.5px solid var(--gold);color:var(--gold);border-radius:10px;
  padding:.4rem .8rem;font-weight:700;font-size:.85rem}

/* ══════════════════ MOTORRISTI ══════════════════ */
#v-runs{padding:clamp(.7rem,2vw,1.2rem);display:grid;gap:.9rem;max-width:720px;margin-inline:auto;
  align-content:start}
.rsec{display:grid;gap:.6rem}
.rsec h2{font-family:var(--display);font-size:1.15rem;margin:0;font-weight:400;letter-spacing:.02em}
.rsec .sub{color:var(--muted);font-size:.84rem;margin:0}

.stop{background:var(--pan);border:1.5px solid var(--line);border-radius:16px;overflow:hidden}
.stop.pick{border-color:var(--brand)}
.stop.gone{opacity:.45}
.s-hd{display:flex;align-items:center;gap:.6rem;padding:.7rem .9rem;background:var(--pan-2)}
.s-no{font-family:var(--display);font-size:1.35rem;line-height:1}
.s-pay{font-size:.66rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  border-radius:999px;padding:.22rem .55rem}
.s-pay.cash{background:rgba(255,194,68,.16);color:var(--gold)}
.s-pay.card{background:rgba(76,175,109,.16);color:var(--ok)}
.s-tot{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;font-size:1.05rem}
.s-bd{padding:.7rem .9rem;display:grid;gap:.4rem}
.s-name{font-weight:600}
.s-addr{color:var(--muted);font-size:.92rem;line-height:1.35}
.s-note{background:rgba(230,178,60,.14);border-left:3px solid var(--warn);border-radius:0 8px 8px 0;
  padding:.4rem .55rem;font-size:.9rem;color:#f4dca6;margin:.1rem 0 0}
.s-act{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;padding:0 .9rem .9rem}
.s-act .wide{grid-column:1/-1}
.sbtn{border-radius:12px;padding:.75rem;font-size:.92rem;font-weight:700;text-align:center;
  display:flex;align-items:center;justify-content:center;gap:.4rem;transition:.15s}
.sbtn:active{transform:scale(.97)}
.s-nav{background:var(--pan-3);border:1.5px solid var(--line)}
.s-nav:hover{border-color:var(--gold);color:var(--gold)}
.s-call{background:var(--pan-3);border:1.5px solid var(--line)}
.s-done{background:var(--ok);color:#052312}
.s-fail{border:1.5px solid rgba(229,84,75,.5);color:#ff9a92;font-weight:600;font-size:.84rem}
.s-pickbox{display:flex;align-items:center;gap:.7rem;padding:.7rem .9rem;cursor:pointer}
.s-pickbox .box{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);
  display:grid;place-items:center;flex:none;font-weight:700;color:transparent}
.stop.pick .box{background:var(--brand);border-color:var(--brand);color:#1B0D02}

.gobar{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 32%);
  padding:1rem 0 .6rem;display:grid;gap:.5rem;z-index:15}
.gobtn{background:var(--brand);color:#1B0D02;border-radius:14px;padding:1rem;
  font-size:1.1rem;font-weight:700;text-align:center}
.gobtn:disabled{opacity:.35;pointer-events:none}

.daybox{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}
.daybox div{background:var(--pan);border:1px solid var(--line);border-radius:14px;
  padding:.7rem;text-align:center}
.daybox b{display:block;font-family:var(--display);font-size:1.5rem;color:var(--gold);
  font-variant-numeric:tabular-nums}
.daybox span{font-size:.7rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}

.privacy{font-size:.74rem;color:var(--muted);line-height:1.45;background:var(--pan);
  border:1px solid var(--line);border-radius:12px;padding:.7rem .85rem;margin:0}

/* ---------- dritarja e dorëzimit ---------- */
.modal{position:fixed;inset:0;z-index:60;display:none;place-items:center;padding:1rem}
.modal.on{display:grid}
.modal-bg{position:absolute;inset:0;background:rgba(0,0,0,.82)}
.modal-card{position:relative;background:var(--pan);border:1px solid var(--line);
  border-radius:20px;padding:1.4rem;width:min(400px,100%);display:grid;gap:.85rem}
.modal-card h3{margin:0;font-family:var(--display);font-size:1.2rem;font-weight:400}
.modal-card p{margin:0;font-size:.88rem;color:var(--muted)}
.modal-card input,.modal-card select{background:#0F0B0C;border:1.5px solid var(--line);
  border-radius:11px;padding:.7rem .8rem;color:var(--txt);font:inherit;width:100%}
.modal-card input:focus,.modal-card select:focus{border-color:var(--brand);outline:none}
.modal-act{display:grid;grid-template-columns:1fr auto;gap:.5rem}
</style>


<!-- ─────── HYRJA (e njëjtë për të gjithë) ─────── -->
<div id="gate">
  <div class="gate-card">
    <div class="logo">SPR<em>I</em>NT</div>

      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>

    </div>
  </div>
</div>

<!-- ─────── APLIKACIONI ─────── -->
<div id="app" class="hide">
  <div id="offline">Pa internet — po tregohet gjendja e fundit e njohur.</div>

  <header>
    <span class="logo">SPR<em>I</em>NT</span>
    <span class="who" id="whoTxt"></span>
    <div class="switch hide" id="switcher"></div>

      <span class="cbadge hide" id="kdsCount">Furrë <b id="cPrep">0</b> · Gati <b id="cReady">0</b></span>
      <button class="hbtn hide" id="sndBtn" title="Zilja për porosi të reja">🔔</button>
      <button class="hbtn" id="refBtn" title="Rifresko">↻</button>
      <button class="hbtn" id="outBtn">Dil</button>
    </div>
  </header>

  <main id="v-kds" class="hide"></main>
  <main id="v-runs" class="hide"></main>

  <div id="undo">
    <span>Porosia <b id="undoNo"></b> u shpall gati.</span>
    <button id="undoBtn">Kthe mbrapsht</button>
  </div>
</div>

<!-- ─────── DORËZIMI ─────── -->
<div class="modal" id="dlvModal" role="dialog" aria-modal="true" aria-label="Dorëzimi">
  <div class="modal-bg" data-dlv-close></div>
  <div class="modal-card">
    <h3 id="dlvTitle">Dorëzimi</h3>
    <p id="dlvSub"></p>
    <div id="dlvCashWrap">
      <input id="dlvCash" inputmode="numeric" aria-label="Sa para arkëtove">
    </div>
    <p class="gate-err" id="dlvErr"></p>
    <div class="modal-act">
      <button class="sbtn s-done" id="dlvOk">Konfirmo dorëzimin</button>
      <button class="hbtn" data-dlv-close>Anulo</button>
    </div>
  </div>
</div>

<!-- ─────── NUK U GJEND ─────── -->
<div class="modal" id="failModal" role="dialog" aria-modal="true" aria-label="Nuk u gjend">
  <div class="modal-bg" data-fail-close></div>
  <div class="modal-card">
    <h3>Porosia kthehet te banaku</h3>
    <p>Zgjidh arsyen. Banaku e sheh menjëherë dhe merret me klientin.</p>
    <select id="failReason">
      <option>Nuk përgjigjet në telefon</option>
      <option>Adresa nuk u gjet</option>
      <option>Klienti e anuloi</option>
      <option>Klienti nuk kishte para</option>
      <option>Arsye tjetër</option>
    </select>
    <div class="modal-act">
      <button class="sbtn s-fail" id="failOk">Kthe te banaku</button>
      <button class="hbtn" data-fail-close>Anulo</button>
    </div>
  </div>
</div>

   1. Bosh (si tani)  — gjithçka rri në shfletues. Mirë për ta provuar.
   2. Serveri lokal   — programi ngrihet mbi kompjuterin e dyqanit me
                        `node local/server.js`. Serveri e vendos vetë këtë,
                        ndaj këtu nuk preket asgjë.
   3. Supabase        — për përdorim online. Vendos URL-në dhe çelësin `anon`.
                        Ai çelës është publik nga natyra; çelësi `service_role`
                        nuk vihet KURRË këtu.
   ========================================================================== */
window.SPRINT_CONFIG = window.SPRINT_LOCAL
  ? { SUPABASE_URL: '', SUPABASE_ANON_KEY: 'local', PHOTO_BUCKET: 'photos', LOCAL: true }
  : {
      SUPABASE_URL: '',
      SUPABASE_ANON_KEY: '',
      PHOTO_BUCKET: 'photos',
    };

</script>

<script>
/* ============================================================================
   SPRINT — Shtresa e ruajtjes.
   Flet me Supabase përmes REST-it (pa asnjë bibliotekë të jashtme).
   Nëse Supabase nuk është konfiguruar, bie te ruajtja lokale në shfletues,
   që paneli admin të jetë i provueshëm edhe pa llogari.
   ========================================================================== */
(function () {
  const S = window.SPRINT;
  const CFG = window.SPRINT_CONFIG || {};
  const URL_ = (CFG.SUPABASE_URL || '').replace(/\/+$/, '');
  const KEY = CFG.SUPABASE_ANON_KEY || '';
  const BUCKET = CFG.PHOTO_BUCKET || 'photos';
  // Serveri lokal shërben faqen nga e njëjta adresë, ndaj URL-ja rri bosh dhe
  // kërkesat shkojnë relative. Për Supabase duhen të dyja.
  const configured = !!(CFG.LOCAL || (URL_ && KEY));

  const LS_SESSION = 'sprint-session';
  const LS_LOCAL = 'sprint-local-content';

  /* ---------------- sesioni ---------------- */
  let session = null;
  try { session = JSON.parse(localStorage.getItem(LS_SESSION) || 'null'); } catch (e) {}

  const saveSession = (s) => {
    session = s;
    if (s) localStorage.setItem(LS_SESSION, JSON.stringify(s));
    else localStorage.removeItem(LS_SESSION);
  };

  const authHeader = () => (session && session.access_token)
    ? 'Bearer ' + session.access_token : 'Bearer ' + KEY;

  const headers = (extra) => Object.assign({
    apikey: KEY,
    Authorization: authHeader(),
    'Content-Type': 'application/json',
  }, extra || {});

  async function req(path, opts) {
    const r = await fetch(URL_ + path, opts);
    if (!r.ok) {
      let msg = r.status + ' ' + r.statusText;
      try { const j = await r.json(); msg = j.message || j.error_description || j.msg || msg; } catch (e) {}
      throw new Error(msg);
    }
    return r.status === 204 ? null : r.json();
  }

  /* ---------------- hyrja ---------------- */
  async function signIn(email, password) {
    if (!configured) throw new Error('Supabase nuk është konfiguruar te shared/config.js');
    const data = await req('/auth/v1/token?grant_type=password', {
      method: 'POST',
      headers: { apikey: KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    saveSession({
      access_token: data.access_token,
      refresh_token: data.refresh_token,
      email: (data.user && data.user.email) || email,
      expires_at: Date.now() + (data.expires_in || 3600) * 1000,
    });
    return session;
  }

  async function refresh() {
    if (!session || !session.refresh_token) return null;
    try {
      const data = await req('/auth/v1/token?grant_type=refresh_token', {
        method: 'POST',
        headers: { apikey: KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ refresh_token: session.refresh_token }),
      });
      saveSession({
        access_token: data.access_token,
        refresh_token: data.refresh_token,
        email: session.email,
        expires_at: Date.now() + (data.expires_in || 3600) * 1000,
      });
      return session;
    } catch (e) { saveSession(null); return null; }
  }

  /** Siguron një token të vlefshëm para çdo shkrimi. */
  async function ensureAuth() {
    if (!session) return null;
    if (session.expires_at && session.expires_at - Date.now() < 60000) return refresh();
    return session;
  }

  const signOut = () => saveSession(null);
  const currentUser = () => (session ? { email: session.email } : null);

  /* ---------------- leximi publik ---------------- */
  /** Rreshti i tabelës → objekti që pret faqja. */
  const rowToItem = (r) => ({
    id: r.id, c: r.category, art: r.art || 'pizza',
    sq: r.name_sq, en: r.name_en || r.name_sq,
    dsq: r.desc_sq || '', den: r.desc_en || '',
    p: Number(r.price) || 0,
    unit: r.unit || undefined,
    note: r.note || undefined,
    tags: Array.isArray(r.tags) ? r.tags : [],
    img: r.image_url || undefined,
    available: r.available !== false,
    sort: r.sort == null ? 0 : Number(r.sort),
  });

  const itemToRow = (m) => ({
    id: m.id, category: m.c, art: m.art || 'pizza',
    name_sq: m.sq, name_en: m.en || m.sq,
    desc_sq: m.dsq || '', desc_en: m.den || '',
    price: Number(m.p) || 0,
    unit: m.unit || null,
    note: m.note || null,
    tags: m.tags || [],
    image_url: m.img || null,
    available: m.available !== false,
    sort: m.sort == null ? 0 : Number(m.sort),
  });

  /** Lexon menunë dhe cilësimet. Kthen null nëse s'ka asgjë të publikuar. */
  async function fetchAll() {
    if (!configured) return readLocal();
    const [items, settings] = await Promise.all([
      req('/rest/v1/menu_items?select=*&order=sort.asc', { headers: headers() }),
      req('/rest/v1/settings?select=data&id=eq.main', { headers: headers() }),
    ]);
    if (!items || !items.length) return null;
    return {
      menu: items.map(rowToItem),
      settings: (settings && settings[0] && settings[0].data) || null,
    };
  }

  /* ---------------- shkrimi (vetëm i identifikuar) ---------------- */
  async function saveItems(list) {
    if (!configured) return writeLocal({ menu: list });
    await ensureAuth();
    return req('/rest/v1/menu_items?on_conflict=id', {
      method: 'POST',
      headers: headers({ Prefer: 'resolution=merge-duplicates,return=minimal' }),
      body: JSON.stringify(list.map(itemToRow)),
    });
  }

  async function deleteItem(id) {
    if (!configured) {
      const cur = readLocal() || {};
      return writeLocal({ menu: (cur.menu || []).filter((m) => m.id !== id) });
    }
    await ensureAuth();
    return req('/rest/v1/menu_items?id=eq.' + encodeURIComponent(id), {
      method: 'DELETE', headers: headers({ Prefer: 'return=minimal' }),
    });
  }

  async function saveSettings(data) {
    if (!configured) {
      const cur = readLocal() || {};
      return writeLocal({ menu: cur.menu, settings: data });
    }
    await ensureAuth();
    return req('/rest/v1/settings?on_conflict=id', {
      method: 'POST',
      headers: headers({ Prefer: 'resolution=merge-duplicates,return=minimal' }),
      body: JSON.stringify([{ id: 'main', data }]),
    });
  }

  /* ---------------- fotot ---------------- */
  const PHOTO_MAX = 3 * 1024 * 1024;   // 3 MB pas ngjeshjes

  /** Zvogëlon dhe ngjesh foton në shfletues para ngarkimit. */
  function compress(file, maxSide) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        URL.revokeObjectURL(url);
        const side = maxSide || 1200;
        let { width: w, height: h } = img;
        if (Math.max(w, h) > side) {
          const k = side / Math.max(w, h);
          w = Math.round(w * k); h = Math.round(h * k);
        }
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        cv.toBlob((b) => (b ? resolve(b) : reject(new Error('Nuk u ngjesh dot fotoja'))), 'image/jpeg', 0.84);
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Skedari nuk është foto')); };
      img.src = url;
    });
  }

  async function uploadPhoto(file, name) {
    const blob = await compress(file, 1200);
    if (blob.size > PHOTO_MAX) throw new Error('Fotoja është shumë e madhe edhe pas ngjeshjes');
    const path = name + '-' + Date.now() + '.jpg';

    if (!configured) {                         // pa Supabase: ruaje si data URI lokal
      return new Promise((res) => {
        const fr = new FileReader();
        fr.onload = () => res(fr.result);
        fr.readAsDataURL(blob);
      });
    }
    await ensureAuth();
    const r = await fetch(URL_ + '/storage/v1/object/' + BUCKET + '/' + path, {
      method: 'POST',
      headers: { apikey: KEY, Authorization: authHeader(), 'Content-Type': 'image/jpeg', 'x-upsert': 'true' },
      body: blob,
    });
    if (!r.ok) {
      let msg = r.status + ' ' + r.statusText;
      try { const j = await r.json(); msg = j.message || j.error || msg; } catch (e) {}
      throw new Error('Ngarkimi dështoi: ' + msg);
    }
    return URL_ + '/storage/v1/object/public/' + BUCKET + '/' + path;
  }

  /* ---------------- ruajtja lokale (rezervë) ---------------- */
  function readLocal() {
    try {
      const raw = localStorage.getItem(LS_LOCAL);
      if (!raw) return null;
      const d = JSON.parse(raw);
      return d && d.menu && d.menu.length ? d : null;
    } catch (e) { return null; }
  }
  function writeLocal(patch) {
    const cur = readLocal() || {};
    const next = { menu: patch.menu || cur.menu || [], settings: patch.settings || cur.settings || null };
    localStorage.setItem(LS_LOCAL, JSON.stringify(next));
    return next;
  }
  const clearLocal = () => localStorage.removeItem(LS_LOCAL);


  /** Fshin nga hapësira e fotove skedarin që i përket kësaj adrese. */
  async function deletePhoto(url) {
    if (!url || !configured) return;                       // data: URI lokale s'kanë çfarë të fshijnë
    const marker = '/storage/v1/object/public/' + BUCKET + '/';
    const at = url.indexOf(marker);
    if (at < 0) return;                                    // foto e jashtme, jo e jona
    const path = url.slice(at + marker.length).split('?')[0];
    await ensureAuth();
    const r = await fetch(URL_ + '/storage/v1/object/' + BUCKET + '/' + path, {
      method: 'DELETE',
      headers: { apikey: KEY, Authorization: authHeader() },
    });
    // Nëse skedari mungon tashmë, s'ka pse të bëjmë zhurmë.
    if (!r.ok && r.status !== 404) {
      let msg = r.status + ' ' + r.statusText;
      try { const j = await r.json(); msg = j.message || j.error || msg; } catch (e) {}
      throw new Error(msg);
    }
  }

  /* ---------------- porositë dhe rezervimet ---------------- */
  const LS_ORDERS = 'sprint-local-orders';
  const LS_BOOKINGS = 'sprint-local-bookings';

  /* Ruajtja e shfletuesit nuk është gjithmonë e hapur: dritare private, të
     dhëna faqeje të ndaluara, ose një kornizë pa origjinë — te secila prej
     tyre localStorage-i hedh gabim. Programi duhet të punojë gjithsesi, ndaj
     mban një kopje në kujtesë dhe ruajtja bëhet kur mundet. */
  const mem = {};
  const readLS = (k) => {
    try {
      const raw = localStorage.getItem(k);
      if (raw != null) return JSON.parse(raw);
    } catch (e) {}
    return k in mem ? mem[k] : [];
  };
  const writeLS = (k, v) => {
    mem[k] = v;
    try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {}
  };
  const rid = () => 'loc-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  /** I njëjti format kodi si te baza: 8 shenja pa I, O, 0, 1. */
  const CODE_ABC = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const genCode = () => Array.from({ length: 8 },
    () => CODE_ABC[Math.floor(Math.random() * CODE_ABC.length)]).join('');
  /** Heq vizat dhe hapësirat, që klienti ta shkruajë si t'i vijë. */
  const normCode = (c) => String(c || '').replace(/[^A-Za-z0-9]/g, '').toUpperCase();
  /** Kodi siç shfaqet: A4F7-K2M9 */
  const fmtCode = (c) => { const n = normCode(c); return n.length > 4 ? n.slice(0, 4) + '-' + n.slice(4) : n; };

  /** Krijon porosinë. Kthen numrin dhe kodin e ndjekjes. */
  async function createOrder(o) {
    const body = {
      status: 'new',
      kind: o.kind || 'delivery',
      customer_name: o.name,
      phone: o.phone,
      address: o.address || null,
      note: o.note || null,
      items: o.items,
      subtotal: o.subtotal,
      delivery_fee: o.deliveryFee || 0,
      total: o.total,
      payment: o.payment || 'cash',
      wanted_at: o.wantedAt || 'asap',
      lang: o.lang || 'sq',
    };
    // Fushat e programit të biznesit. Shtohen vetëm kur ekzistojnë, që porositë
    // e faqes të mbeten të pandryshuara dhe skema e vjetër të mos prishet.
    if (o.channel) body.channel = o.channel;
    if (o.customerId) body.customer_id = o.customerId;
    if (o.lat != null && o.lng != null) {
      body.lat = o.lat; body.lng = o.lng;
      if (o.accuracy != null) body.accuracy = o.accuracy;
    }
    if (o.prepMinutes) body.prep_minutes = o.prepMinutes;
    if (!configured) {
      const list = readLS(LS_ORDERS);
      const row = Object.assign({
        id: rid(),
        number: 1000 + list.length,
        token: genCode(),
        created_at: new Date().toISOString(),
        updated_at: new Date().toISOString(),
      }, body);
      list.unshift(row); writeLS(LS_ORDERS, list);
      return row;
    }
    const rows = await req('/rest/v1/orders', {
      method: 'POST',
      headers: headers({ Prefer: 'return=representation' }),
      body: JSON.stringify([body]),
    });
    return rows && rows[0];
  }

  /** Porositë e ditës (ose të një dite të caktuar), më e reja e para. */
  async function fetchOrders(opts) {
    opts = opts || {};
    if (!configured) {
      const from = opts.from ? new Date(opts.from).getTime() : 0;
      return readLS(LS_ORDERS).filter((o) => new Date(o.created_at).getTime() >= from);
    }
    let q = '/rest/v1/orders?select=*&order=created_at.desc&limit=' + (opts.limit || 200);
    if (opts.from) q += '&created_at=gte.' + encodeURIComponent(opts.from);
    if (opts.to) q += '&created_at=lt.' + encodeURIComponent(opts.to);
    await ensureAuth();
    return req(q, { headers: headers() });
  }

  async function updateOrder(id, patch) {
    if (!configured) {
      const list = readLS(LS_ORDERS);
      const row = list.find((o) => o.id === id);
      if (row) Object.assign(row, patch, { updated_at: new Date().toISOString() });
      writeLS(LS_ORDERS, list);
      return row;
    }
    await ensureAuth();
    const rows = await req('/rest/v1/orders?id=eq.' + encodeURIComponent(id), {
      method: 'PATCH',
      headers: headers({ Prefer: 'return=representation' }),
      body: JSON.stringify(patch),
    });
    return rows && rows[0];
  }

  async function deleteOrder(id) {
    if (!configured) { writeLS(LS_ORDERS, readLS(LS_ORDERS).filter((o) => o.id !== id)); return; }
    await ensureAuth();
    return req('/rest/v1/orders?id=eq.' + encodeURIComponent(id), {
      method: 'DELETE', headers: headers({ Prefer: 'return=minimal' }),
    });
  }

  /** Ndjekja publike e një porosie me kodin e saj. */
  async function trackOrder(code) {
    const c = normCode(code);
    if (c.length < 6) return null;
    if (!configured) {
      const o = readLS(LS_ORDERS).find((x) => normCode(x.token) === c);
      return o ? Object.assign({ code: o.token }, o) : null;
    }
    const rows = await rpc('track_order', { p_token: c });
    return (rows && rows[0]) || null;
  }

  /** Porositë ende në punë të një numri telefoni, të 24 orëve të fundit. */
  async function findOrdersByPhone(phone) {
    const d = String(phone || '').replace(/\D/g, '');
    if (d.length < 6) return [];
    if (!configured) {
      const cut = Date.now() - 24 * 3600 * 1000;
      return readLS(LS_ORDERS)
        .filter((o) => String(o.phone || '').replace(/\D/g, '').slice(-9) === d.slice(-9))
        .filter((o) => new Date(o.created_at).getTime() > cut)
        .filter((o) => !['done', 'cancelled'].includes(o.status))
        .slice(0, 5)
        .map((o) => Object.assign({ code: o.token }, o));
    }
    return (await rpc('find_orders_by_phone', { p_phone: d })) || [];
  }

  /** Thirrje funksioni në bazë, gjithnjë me çelësin publik. */
  /**
   * Funksionet e bazës.
   * Autorizimi vjen nga sesioni kur ka njeri të futur, dhe bie te çelësi publik
   * kur s'ka. Kështu i njëjti helper u shërben të dyjave: gjurmimit që e bën
   * klienti pa llogari, dhe funksioneve që i lejohen vetëm panelit.
   */
  function rpc(name, body) {
    return req('/rest/v1/rpc/' + name, {
      method: 'POST',
      headers: { apikey: KEY, Authorization: authHeader(), 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
  }

  async function createBooking(b) {
    const body = {
      status: 'new', customer_name: b.name, phone: b.phone, date: b.date,
      time: b.time || null, people: b.people || null, area: b.area || null,
      note: b.note || null, lang: b.lang || 'sq',
    };
    if (!configured) {
      const list = readLS(LS_BOOKINGS);
      const row = Object.assign({ id: rid(), number: 100 + list.length,
        created_at: new Date().toISOString() }, body);
      list.unshift(row); writeLS(LS_BOOKINGS, list);
      return row;
    }
    const rows = await req('/rest/v1/bookings', {
      method: 'POST',
      headers: headers({ Prefer: 'return=representation' }),
      body: JSON.stringify([body]),
    });
    return rows && rows[0];
  }

  async function fetchBookings(opts) {
    opts = opts || {};
    if (!configured) return readLS(LS_BOOKINGS);
    let q = '/rest/v1/bookings?select=*&order=date.asc,time.asc&limit=' + (opts.limit || 200);
    if (opts.from) q += '&date=gte.' + encodeURIComponent(opts.from);
    await ensureAuth();
    return req(q, { headers: headers() });
  }

  async function updateBooking(id, patch) {
    if (!configured) {
      const list = readLS(LS_BOOKINGS);
      const row = list.find((b) => b.id === id);
      if (row) Object.assign(row, patch);
      writeLS(LS_BOOKINGS, list);
      return row;
    }
    await ensureAuth();
    const rows = await req('/rest/v1/bookings?id=eq.' + encodeURIComponent(id), {
      method: 'PATCH',
      headers: headers({ Prefer: 'return=representation' }),
      body: JSON.stringify(patch),
    });
    return rows && rows[0];
  }

  /* ---------------- zbatimi mbi të dhënat e faqes ---------------- */
  /** Fut përmbajtjen e publikuar mbi vlerat e ngurta të shared/data.js. */
  function apply(payload) {
    if (!payload) return false;
    if (payload.menu && payload.menu.length) {
      const live = payload.menu
        .filter((m) => m.available !== false)
        .sort((a, b) => (a.sort || 0) - (b.sort || 0));
      S.menu.length = 0;
      live.forEach((m) => S.menu.push(m));
    }
    const st = payload.settings;
    if (st) {
      if (st.config) Object.assign(S.config, st.config);
      if (st.categories && st.categories.length) {
        S.categories.length = 0;
        st.categories.forEach((c) => S.categories.push(c));
      }
      if (st.reviews) { S.reviews.length = 0; st.reviews.forEach((r) => S.reviews.push(r)); }
      if (st.stats && st.stats.length) { S.stats.length = 0; st.stats.forEach((x) => S.stats.push(x)); }
    }
    return true;
  }

  S.store = {
    configured, fetchAll, apply,
    signIn, signOut, currentUser, ensureAuth,
    saveItems, deleteItem, saveSettings,
    uploadPhoto, deletePhoto, compress,
    createOrder, fetchOrders, updateOrder, deleteOrder, trackOrder, findOrdersByPhone,
    genCode, normCode, fmtCode,
    createBooking, fetchBookings, updateBooking,
    readLocal, writeLocal, clearLocal,
    rowToItem, itemToRow,

    // Primitiva për shared/store-biznes.js, që moduli i biznesit të mos
    // rindërtojë vetë kokat e autorizimit dhe rifreskimin e tokenit.
    _req: req, _headers: headers, _rpc: rpc, _ensureAuth: ensureAuth,
  };
})();

</script>
<script>
/* ============================================================================
   SPRINT — Shtresa e programit të biznesit.
   Fazat, klientët dhe stafi. Ndërtohet mbi shared/store.js.

   Si te pjesa tjetër e programit: pa Supabase, gjithçka punon lokalisht në
   shfletues, që paneli të jetë i provueshëm pa llogari.
   ========================================================================== */
(function () {
  const S = window.SPRINT;
  const st = S.store;
  const live = st.configured;

  const LS_PHASES    = 'sprint-phases';
  const LS_CUSTOMERS = 'sprint-customers';
  const LS_STAFF     = 'sprint-staff';
  const LS_DEVICE    = 'sprint-device';

  /* Si te shared/store.js: kur ruajtja e shfletuesit është e mbyllur, gjithçka
     rri në kujtesë. Sesioni i hyrjes kalon këndej, ndaj pa këtë rezervë kodi
     pranohej dhe sesioni humbte në të njëjtin çast. */
  const mem = {};
  const readLS = (k, fb) => {
    try {
      const raw = localStorage.getItem(k);
      if (raw != null) return JSON.parse(raw) || fb;
    } catch (e) {}
    return k in mem ? mem[k] : fb;
  };
  const writeLS = (k, v) => {
    mem[k] = v;
    try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {}
  };

  // Identifikues i vetëm për modalitetin lokal. Date.now() nuk mjafton: dy rreshta
  // të krijuar brenda të njëjtit milisekond do të merrnin të njëjtin id.
  const uid = (p) => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

  /* ══════════════════ FAZAT ══════════════════
     Çelësat janë saktësisht vlerat e `orders.status`, që të mos ketë përkthim
     midis dy fjalorëve. Të fiksuar sepse kuzhina, motorristi dhe faqja e
     klientit varen prej tyre; gjithçka tjetër është e jotja. Këto vlera
     pasqyrojnë saktësisht ato që mbjell supabase/schema-2-biznes.sql. */

  const DEFAULT_PHASES = [
    { key:'new',       sort:10, label_sq:'E marrë',  label_en:'Placed',     customer_label_sq:'E marrë',        customer_label_en:'Received',    icon:'📥', color:'#8a8a8a', enabled:true, customer_visible:true, target_minutes:null, is_core:true  },
    { key:'accepted',  sort:20, label_sq:'Pranuar',  label_en:'Accepted',   customer_label_sq:'Po përgatitet',  customer_label_en:'In progress', icon:'✓',  color:'#c4640b', enabled:true, customer_visible:true, target_minutes:3,    is_core:false },
    { key:'preparing', sort:30, label_sq:'Në furrë', label_en:'In kitchen', customer_label_sq:'Po përgatitet',  customer_label_en:'In progress', icon:'🔥', color:'#c4640b', enabled:true, customer_visible:true, target_minutes:20,   is_core:true  },
    { key:'ready',     sort:40, label_sq:'Gati',     label_en:'Ready',      customer_label_sq:'Nisi për te ti', customer_label_en:'On its way',  icon:'🛎',  color:'#3b6446', enabled:true, customer_visible:true, target_minutes:5,    is_core:false },
    { key:'delivering',sort:50, label_sq:'Në rrugë', label_en:'On the way', customer_label_sq:'Nisi për te ti', customer_label_en:'On its way',  icon:'🛵', color:'#3b6446', enabled:true, customer_visible:true, target_minutes:25,   is_core:true  },
    { key:'done',      sort:60, label_sq:'Dorëzuar', label_en:'Delivered',  customer_label_sq:'Dorëzuar',       customer_label_en:'Delivered',   icon:'🏁', color:'#3b6446', enabled:true, customer_visible:true, target_minutes:null, is_core:true  },
    { key:'cancelled', sort:70, label_sq:'Anuluar',  label_en:'Cancelled',  customer_label_sq:'Anuluar',        customer_label_en:'Cancelled',   icon:'✕',  color:'#a22f1b', enabled:true, customer_visible:true, target_minutes:null, is_core:true  },
  ];

  const clonePhases = () => DEFAULT_PHASES.map((p) => Object.assign({}, p));

  /** Të gjitha fazat, për panelin. */
  async function fetchPhases() {
    if (!live) return readLS(LS_PHASES, clonePhases());
    const rows = await st._req('/rest/v1/order_phases?select=*&order=sort', { headers: st._headers() });
    return (rows && rows.length) ? rows : clonePhases();
  }

  /** Ruan fazat e ndryshuara. Çelësi dhe is_core nuk preken kurrë. */
  async function savePhases(list) {
    const clean = list.map((p) => ({
      key: p.key,
      sort: Number(p.sort) || 0,
      label_sq: String(p.label_sq || '').trim().slice(0, 40),
      label_en: String(p.label_en || '').trim().slice(0, 40),
      customer_label_sq: String(p.customer_label_sq || '').trim().slice(0, 40) || null,
      customer_label_en: String(p.customer_label_en || '').trim().slice(0, 40) || null,
      icon: String(p.icon || '').slice(0, 8),
      color: String(p.color || '').slice(0, 20),
      enabled: p.is_core ? true : !!p.enabled,
      customer_visible: !!p.customer_visible,
      target_minutes: p.target_minutes ? Number(p.target_minutes) : null,
    }));

    if (!live) {
      const merged = clean.map((c) => {
        const base = DEFAULT_PHASES.find((d) => d.key === c.key) || {};
        return Object.assign({}, base, c);
      });
      writeLS(LS_PHASES, merged);
      return merged;
    }
    await st._ensureAuth();
    return st._req('/rest/v1/order_phases?on_conflict=key', {
      method: 'POST',
      headers: st._headers({ Prefer: 'resolution=merge-duplicates,return=representation' }),
      body: JSON.stringify(clean),
    });
  }

  /** Rikthen fazat te vlerat fillestare. */
  async function resetPhases() { return savePhases(clonePhases()); }

  /** Hapat që sheh klienti te faqja e gjurmimit, me emrat që ke vendosur ti. */
  async function publicPhases() {
    if (!live) {
      return readLS(LS_PHASES, clonePhases())
        .filter((p) => p.enabled && p.customer_visible && p.key !== 'cancelled')
        .sort((a, b) => a.sort - b.sort)
        .map((p) => ({
          key: p.key, sort: p.sort,
          label_sq: p.customer_label_sq || p.label_sq,
          label_en: p.customer_label_en || p.label_en,
          icon: p.icon, color: p.color,
        }));
    }
    try { return await st._rpc('public_phases', {}); }
    catch (e) { return []; }
  }

  /** Bashkon fazat që kanë të njëjtën etiketë për klientin, ruajtur radhën. */
  function customerSteps(phases, lang) {
    const out = [];
    (phases || []).forEach((p) => {
      const label = (lang === 'en' ? p.label_en : p.label_sq) || p.label_sq;
      const last = out[out.length - 1];
      if (last && last.label === label) { last.keys.push(p.key); return; }
      out.push({ label, icon: p.icon, color: p.color, keys: [p.key] });
    });
    return out;
  }

  const digits = (s) => String(s || '').replace(/\D/g, '');

  /** Numri sjell emrin, adresat e ruajtura dhe porosinë e fundit. */
  async function lookupCustomer(phone) {
    const d = digits(phone);
    if (d.length < 6) return null;

    if (!live) {
      const all = readLS(LS_CUSTOMERS, []);
      const c = all.find((x) => digits(x.phone).slice(-9) === d.slice(-9));
      return c || null;
    }
    await st._ensureAuth();
    const r = await st._rpc('lookup_customer', { p_phone: phone });
    if (!r) return null;
    const row = Array.isArray(r) ? r[0] : r;
    if (!row || !row.customer) return null;
    return {
      id: row.customer.id,
      phone: row.customer.phone,
      name: row.customer.name,
      blocked: row.customer.blocked,
      orders_count: row.customer.orders_count,
      addresses: row.addresses || [],
      last_order: row.last_order || null,
    };
  }

  /** Krijon ose përditëson klientin dhe ruan adresën, pa krijuar dublikatë. */
  async function upsertCustomer(o) {
    const phone = String(o.phone || '').trim();
    if (digits(phone).length < 6) return null;

    if (!live) {
      const all = readLS(LS_CUSTOMERS, []);
      let c = all.find((x) => digits(x.phone).slice(-9) === digits(phone).slice(-9));
      if (!c) { c = { id: uid('c'), phone, name: '', addresses: [], orders_count: 0 }; all.push(c); }
      if (o.name) c.name = o.name;
      const addr = String(o.address || '').trim();
      if (addr.length >= 3) {
        const hit = c.addresses.find((a) => a.address.toLowerCase() === addr.toLowerCase());
        if (hit) { if (o.lat) { hit.lat = o.lat; hit.lng = o.lng; hit.accuracy = o.accuracy; } }
        else c.addresses.unshift({ address: addr, lat: o.lat || null, lng: o.lng || null, accuracy: o.accuracy || null });
      }
      writeLS(LS_CUSTOMERS, all);
      return c.id;
    }
    await st._ensureAuth();
    return st._rpc('upsert_customer', {
      p_phone: phone, p_name: o.name || '', p_address: o.address || null,
      p_lat: o.lat || null, p_lng: o.lng || null, p_accuracy: o.accuracy || null,
    });
  }

  function ensureLocalOrders() {
    if (live) return Promise.resolve();
    if (demoRunning) return demoRunning;
    demoRunning = (async () => {
      const from = new Date(Date.now() - 12 * 3600e3).toISOString();
      const have = (await st.fetchOrders({ from })) || [];
      if (have.length) return;
      for (const d of DEMO_ORDERS) {
        const total = d.items.reduce((n, [, q, p]) => n + q * p, 0);
        const row = await st.createOrder({
          kind: d.kind, name: d.name, phone: d.phone, address: d.addr, note: d.note,
          items: d.items.map(([name, qty, price], i) => ({ id: 'demo' + d.n + i, name, qty, price })),
          subtotal: total, total, payment: d.pay, channel: 'phone',
          lat: 41.32 + d.n / 200, lng: 19.44 + d.n / 200,
        });
        const patch = { status: d.st, demo: true,
          accepted_at: new Date(Date.now() - 6 * 60000).toISOString() };

  /** Nisja: disa porosi bashkë. Kthen id-në e nisjes. */
  async function drvStartRun(ids, pos) {
    if (!ids || !ids.length) throw new Error('Zgjidh të paktën një porosi.');
    if (!live) {
      const s = tok();
      const open = readLS('sprint-runs', []).find((r) => r.driver_id === s.staff_id && !r.closed_at);
      if (open) throw new Error('Ke ende një nisje të hapur. Mbylle atë përpara se të nisesh sërish.');
      const runs = readLS('sprint-runs', []);
      const run = { id: uid('r'), driver_id: s.staff_id, driver_name: s.name,
                    started_at: new Date().toISOString(), closed_at: null };
      runs.push(run); writeLS('sprint-runs', runs);
      for (const id of ids) {
        await st.updateOrder(id, { status: 'delivering', run_id: run.id,
          driver_id: s.staff_id, picked_at: new Date().toISOString() });
      }
      addPoint(run.id, null, 'start', pos);
      return run.id;
    }
    return st._rpc('drv_start_run', {
      p_token: tok().token, p_orders: ids,
      p_lat: (pos && pos.lat) || null, p_lng: (pos && pos.lng) || null,
    });
  }

  /** Nisja e hapur e këtij motorristi, me ndalesat. */
  async function drvMyRun() {
    if (!live) {
      const s = tok();
      const run = readLS('sprint-runs', [])
        .filter((r) => r.driver_id === s.staff_id && !r.closed_at)
        .sort((a, b) => new Date(b.started_at) - new Date(a.started_at))[0];
      if (!run) return { run: null, stops: [] };
      const from = new Date(Date.now() - 24 * 3600e3).toISOString();
      const list = (await st.fetchOrders({ from })) || [];
      const stops = list.filter((o) => o.run_id === run.id)
        .sort((a, b) => (a.delivered_at ? 1 : 0) - (b.delivered_at ? 1 : 0) || a.number - b.number);
      const cash = stops.filter((o) => o.payment === 'cash')
        .reduce((n, o) => n + (Number(o.total) || 0), 0);
      return { run: Object.assign({ cash_due: cash }, run), stops };
    }
    const rows = (await st._rpc('drv_my_run', { p_token: tok().token })) || [];
    if (!rows.length || !rows[0].run_id) return { run: null, stops: [] };
    const run = { id: rows[0].run_id, started_at: rows[0].started_at, cash_due: rows[0].cash_due };
    const stops = rows.filter((r) => r.id).map((r) => ({
      id: r.id, number: r.number, status: r.status, customer_name: r.customer_name,
      phone: r.phone, address: r.address, lat: r.lat, lng: r.lng,
      total: r.total, payment: r.payment, note: r.note,
      delivered_at: r.delivered_at, fail_reason: r.fail_reason,
    }));
    return { run, stops };
  }

  function addPoint(runId, orderId, kind, pos) {
    const pts = readLS('sprint-run-points', []);
    pts.push({ run_id: runId, order_id: orderId, kind,
               lat: (pos && pos.lat) || null, lng: (pos && pos.lng) || null,
               at: new Date().toISOString() });
    writeLS('sprint-run-points', pts);
  }

  async function drvDelivered(orderId, pos, cash) {
    if (!live) {
      const o = ((await st.fetchOrders({ from: new Date(Date.now() - 24 * 3600e3).toISOString() })) || [])
        .find((x) => x.id === orderId);
      if (!o) throw new Error('Kjo porosi nuk është në nisjen tënde.');
      await st.updateOrder(orderId, { status: 'done', delivered_at: new Date().toISOString(),
        done_at: new Date().toISOString(), cash_collected: cash == null ? null : Number(cash) });
      addPoint(o.run_id, orderId, 'delivered', pos);
      const rest = ((await st.fetchOrders({ from: new Date(Date.now() - 24 * 3600e3).toISOString() })) || [])
        .filter((x) => x.run_id === o.run_id && ['done', 'cancelled'].indexOf(x.status) < 0);
      if (!rest.length) {
        const runs = readLS('sprint-runs', []);
        const r = runs.find((x) => x.id === o.run_id);
        if (r) { r.closed_at = new Date().toISOString(); writeLS('sprint-runs', runs); }
        addPoint(o.run_id, null, 'end', pos);
      }
      return 'done';
    }
    return st._rpc('drv_delivered', {
      p_token: tok().token, p_order: orderId,
      p_lat: (pos && pos.lat) || null, p_lng: (pos && pos.lng) || null,
      p_cash: cash == null ? null : Number(cash),
    });
  }

  /* ══════════════════ VENDNDODHJA ══════════════════ */

  /**
   * Kërkon vendndodhjen nga shfletuesi.
   * Kthen edhe saktësinë, sepse një pin 200 metra larg është më keq se asnjë pin —
   * klienti duhet ta dijë që i duhet ta lëvizë.
   */
  function getLocation(opts) {
    const o = opts || {};
    return new Promise((resolve, reject) => {
      if (!navigator.geolocation) return reject(new Error('Shfletuesi nuk e mbështet vendndodhjen.'));
      navigator.geolocation.getCurrentPosition(
        (pos) => resolve({
          lat: +pos.coords.latitude.toFixed(6),
          lng: +pos.coords.longitude.toFixed(6),
          accuracy: Math.round(pos.coords.accuracy || 0),
        }),
        (err) => {
          const m = {
            1: 'Nuk dhe leje për vendndodhjen. Hape nga cilësimet e shfletuesit.',
            2: 'Vendndodhja nuk u gjet. Provo sërish ose lëvize pinin me dorë.',
            3: 'Kërkimi i vendndodhjes zgjati shumë. Provo sërish.',
          };
          reject(new Error(m[err.code] || 'Vendndodhja nuk u mor.'));
        },
        { enableHighAccuracy: o.high !== false, timeout: o.timeout || 12000, maximumAge: 0 }
      );
    });
  }

  /** Sa e besueshme është vendndodhja: mbi 50 m i themi klientit ta saktësojë. */
  const locationQuality = (acc) =>
    !acc ? 'unknown' : acc <= 25 ? 'good' : acc <= 50 ? 'ok' : 'poor';

  /** Linku i navigimit për motorristin — hapet me aplikacionin e hartave të telefonit. */
  function navLink(o) {
    if (o && o.lat && o.lng) {
      return 'https://www.google.com/maps/dir/?api=1&destination=' + o.lat + ',' + o.lng;
    }
    const a = (o && o.address) || '';
    return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(a + ', Durrës, Albania');
  }

  Object.assign(S.store, {
    DEFAULT_PHASES, fetchPhases, savePhases, resetPhases, publicPhases, customerSteps,
    lookupCustomer, upsertCustomer,
    STAFF_ROLES: ROLES, fetchStaff, saveStaff, deleteStaff, setStaffPin,
    KDS_STATES, kdsOrders, kdsBump,
    DEMO_STAFF, ensureLocalStaff, ensureLocalOrders,
    SCREENS, ALL_SCREENS, DEFAULT_ROLE_SCREENS, fetchRoleScreens, saveRoleScreens, myScreens,
    drvReady, drvStartRun, drvMyRun, drvDelivered, drvFailed, drvMyDay,
    staffLogin, staffSession, staffLogout,
    getLocation, locationQuality, navLink,
  });
})();

<script>
/* ============================================================================
   SPRINT — Pamja e kuzhinës brenda aplikacionit të stafit.
   Regjistrohet te SPRINT.views.kds; guaska e nis dhe e ndal sipas rolit.
   ========================================================================== */
(function () {
  const S = window.SPRINT;
  const store = S.store;
  const $ = (s) => document.querySelector(s);
  const esc = (t) => String(t == null ? '' : t)
    .replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

  const LS_TICK = 'sprint-kds-ticks';
  const LS_SND  = 'sprint-kds-sound';

  const K = { orders: [], phases: [], ticked: {}, sound: true, seen: new Set(),
              lastBump: null, timer: null, undoT: null, live: false };

  try { K.ticked = JSON.parse(localStorage.getItem(LS_TICK) || '{}') || {}; } catch (e) {}
  try { K.sound = localStorage.getItem(LS_SND) !== '0'; } catch (e) {}

  /* ---------- zilja ---------- */
  let ac;
  function beep() {
    if (!K.sound) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      [0, 0.18].forEach((t, i) => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = 'sine'; o.frequency.value = i ? 1180 : 880;
        g.gain.setValueAtTime(0.0001, ac.currentTime + t);
        g.gain.exponentialRampToValueAtTime(0.32, ac.currentTime + t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + t + 0.16);
        o.connect(g); g.connect(ac.destination);
        o.start(ac.currentTime + t); o.stop(ac.currentTime + t + 0.18);
      });
    } catch (e) {}
  }

  /* ---------- koha ---------- */
  const mmss = (ms) => {
    const s = Math.max(0, Math.round(ms / 1000));
    return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  };
  function targetFor(status) {
    const p = K.phases.find((x) => x.key === status);
    return (p && p.target_minutes) || (status === 'preparing' ? 20 : 5);
  }
  function clockOf(o) {
    const since = new Date(o.kitchen_at || o.accepted_at || o.created_at).getTime();
    const mins = (Date.now() - since) / 60000;
    const t = targetFor(o.status === 'ready' ? 'ready' : 'preparing');
    return { txt: mmss(Date.now() - since),
             cls: mins > t ? 'late' : mins > t * 0.7 ? 'warn' : '' };
  }

  /* ---------- vizatimi ---------- */
  const KIND = { pickup: 'Marr vetë', delivery: 'Dërgesë' };
  const itemsOf = (o) => (Array.isArray(o.items) ? o.items : [])
    .map((x) => ({ q: Number(x.qty) || 1, n: x.name || x.id || '' }));

  function render() {
    const list = K.orders;
    if (!list.length) {
      $('#v-kds').innerHTML = '<p class="empty">Asnjë porosi në pritje. 🍕</p>';
    } else {
      $('#v-kds').innerHTML = list.map((o) => {
        const c = clockOf(o);
        const ticks = K.ticked[o.id] || [];
        const items = itemsOf(o).map((it, i) =>
          `<div class="t-line${ticks.indexOf(i) >= 0 ? ' done' : ''}" data-tick="${esc(o.id)}" data-i="${i}">
             <span class="q">${it.q}×</span><span>${esc(it.n)}</span></div>`).join('');
        const act = o.status === 'ready'
          ? `<button class="big b-start" data-bump="${esc(o.id)}" data-to="preparing">↩ Kthe në furrë</button>`
          : o.status === 'preparing'
            ? `<button class="big b-ready" data-bump="${esc(o.id)}" data-to="ready">GATI</button>
               <button class="b-back" data-bump="${esc(o.id)}" data-to="preparing" title="Rinis kohën">↺</button>`
            : `<button class="big b-start" data-bump="${esc(o.id)}" data-to="preparing">Fillo</button>`;
        return `<article class="tick s-${esc(o.status)} ${c.cls}" data-ord="${esc(o.id)}">
          <div class="t-hd">
            <span class="t-no">#${o.number}</span>
            <span class="t-kind${o.kind === 'pickup' ? ' pick' : ''}">${KIND[o.kind] || ''}</span>
            <span class="t-clock" data-clock="${esc(o.id)}">${c.txt}</span>
          </div>
          <div class="t-items">${items}${o.note ? `<p class="t-note">📝 ${esc(o.note)}</p>` : ''}</div>
          <div class="t-act">${act}</div>
        </article>`;
      }).join('');
    }
    $('#cPrep').textContent = list.filter((o) => o.status === 'preparing').length;
    $('#cReady').textContent = list.filter((o) => o.status === 'ready').length;
  }

  /* Vetëm orët rifreskohen çdo sekondë, që prekja të mos humbasë nën gisht. */
  function tickClocks() {
    K.orders.forEach((o) => {
      const el = document.querySelector(`[data-clock="${CSS.escape(o.id)}"]`);
      if (!el) return;
      const c = clockOf(o);
      el.textContent = c.txt;
      const card = el.closest('.tick');
      card.classList.toggle('warn', c.cls === 'warn');
      card.classList.toggle('late', c.cls === 'late');
    });
  }

  async function load(silent) {
    if (!K.live) return;
    try {
      const rows = (await store.kdsOrders()) || [];
      S.staf.offline(false);
      const fresh = rows.filter((o) => !K.seen.has(o.id) && o.status !== 'ready');
      rows.forEach((o) => K.seen.add(o.id));
      if (!silent && fresh.length) beep();
      K.orders = rows;
      render();
    } catch (e) {
      S.staf.offline(true);
      if (/kod|Hyr|esion/i.test(e.message)) S.staf.logout();
    }
  }

  async function bump(id, to) {
    const o = K.orders.find((x) => x.id === id);
    if (!o) return;
    const from = o.status;
    o.status = to;
    if (to === 'preparing') o.kitchen_at = new Date().toISOString();
    render();
    try {
      await store.kdsBump(id, to);
      if (to === 'ready') {
        K.lastBump = { id, from };
        $('#undoNo').textContent = '#' + o.number;
        $('#undo').classList.add('on');
        clearTimeout(K.undoT);
        K.undoT = setTimeout(() => $('#undo').classList.remove('on'), 7000);
      }
      load(true);
    } catch (e) {
      o.status = from; render();
      S.staf.offline(true);
    }
  }

  /* ---------- lidhjet ---------- */
  document.addEventListener('click', (e) => {
    if (!K.live) return;
    const b = e.target.closest('[data-bump]');
    if (b) return bump(b.dataset.bump, b.dataset.to);

    const t = e.target.closest('[data-tick]');
    if (t) {
      const id = t.dataset.tick, i = Number(t.dataset.i);
      const arr = K.ticked[id] || (K.ticked[id] = []);
      const at = arr.indexOf(i);
      if (at >= 0) arr.splice(at, 1); else arr.push(i);
      try { localStorage.setItem(LS_TICK, JSON.stringify(K.ticked)); } catch (err) {}
      t.classList.toggle('done', at < 0);
      return;
    }
    if (e.target.closest('#sndBtn')) {
      K.sound = !K.sound;
      try { localStorage.setItem(LS_SND, K.sound ? '1' : '0'); } catch (err) {}
      $('#sndBtn').classList.toggle('off', !K.sound);
      if (K.sound) beep();
    }
  });

  $('#undoBtn').addEventListener('click', () => {
    if (!K.lastBump) return;
    bump(K.lastBump.id, 'preparing');
    K.lastBump = null;
    $('#undo').classList.remove('on');
  });

  S.views = S.views || {};
  S.views.kds = {
    label: 'Kuzhina',
    start() {
      K.live = true;
      $('#v-kds').classList.remove('hide');
      $('#kdsCount').classList.remove('hide');
      $('#sndBtn').classList.remove('hide');
      $('#sndBtn').classList.toggle('off', !K.sound);
      store.fetchPhases().then((p) => { K.phases = p || []; }).catch(() => {});
      load();
      clearInterval(K.timer);
      K.timer = setInterval(tickClocks, 1000);
    },
    stop() {
      K.live = false;
      clearInterval(K.timer);
      $('#v-kds').classList.add('hide');
      $('#kdsCount').classList.add('hide');
      $('#sndBtn').classList.add('hide');
      $('#undo').classList.remove('on');
    },
    refresh: () => load(true),
  };
})();

</script>
<script>
/* ============================================================================
   SPRINT — Pamja e motorristit.
   Njësia e punës është nisja, jo porosia: motorristët dalin me 2–3 bashkë dhe
   i mbyllin një nga një. Prandaj ekrani ka dy gjendje — zgjedhja para nisjes,
   dhe ndalesat gjatë saj.
   ========================================================================== */
(function () {
  const S = window.SPRINT;
  const store = S.store;
  const $ = (s) => document.querySelector(s);
  const esc = (t) => String(t == null ? '' : t)
    .replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  const money = (n) => (Math.round(n) || 0).toLocaleString('sq-AL') + ' L';

  const R = { ready: [], run: null, stops: [], day: null, pick: new Set(),
              live: false, poll: null, target: null };

  /* Vendndodhja merret vetëm në çastet kur faqja është hapur gjithsesi —
     kur niset dhe kur dorëzon. Pa aplikacion, pa gjurmim të fshehtë. */
  async function here() {
    try { return await store.getLocation({ high: true, timeout: 6000 }); }
    catch (e) { return null; }
  }

  const tel = (p) => 'tel:' + String(p || '').replace(/[^\d+]/g, '');

  /* ---------- vizatimi ---------- */

  function renderPicking() {
    const list = R.ready;
    const head = `<div class="rsec">
      <h2>Gati për t'u marrë</h2>
      <p class="sub">Zgjidh porositë që merr bashkë, pastaj shtyp «Nisu».</p>
    </div>`;

    if (!list.length) {
      return head + '<p class="empty">Asnjë porosi gati. Prit pak. 🛵</p>' + dayBox() + privacy();
    }

    const cards = list.map((o) => {
      const on = R.pick.has(o.id);
      return `<article class="stop${on ? ' pick' : ''}" data-stop="${esc(o.id)}">
        <div class="s-pickbox" data-pickit="${esc(o.id)}">
          <span class="box">✓</span>
          <span class="s-no">#${o.number}</span>
          <span class="s-pay ${o.payment === 'cash' ? 'cash' : 'card'}">${o.payment === 'cash' ? 'Para në dorë' : 'Me kartë'}</span>
          <span class="s-tot">${esc(money(o.total))}</span>
        </div>
        <div class="s-bd">
          <span class="s-name">${esc(o.customer_name)}</span>
          <span class="s-addr">${esc(o.address || '')}${o.lat ? ' · 📍' : ''}</span>
          ${o.note ? `<p class="s-note">📝 ${esc(o.note)}</p>` : ''}
        </div>
      </article>`;
    }).join('');

    const n = R.pick.size;
    const sum = list.filter((o) => R.pick.has(o.id))
      .reduce((s, o) => s + (Number(o.total) || 0), 0);

    return head + cards + `<div class="gobar">
      <button class="gobtn" id="goRun"${n ? '' : ' disabled'}>
        ${n ? `Nisu me ${n} porosi · ${esc(money(sum))}` : 'Zgjidh të paktën një porosi'}
      </button>
    </div>` + dayBox() + privacy();
  }

  function renderRun() {
    const left = R.stops.filter((o) => o.status === 'delivering');
    const done = R.stops.filter((o) => o.status === 'done');

    const head = `<div class="rsec">
      <h2>Nisja jote — ${left.length} ndalesa</h2>
      <p class="sub">Para në dorë për t'u arkëtuar: <b>${esc(money(R.run.cash_due || 0))}</b></p>
    </div>`;

    const card = (o, gone) => `<article class="stop${gone ? ' gone' : ''}" data-stop="${esc(o.id)}">
      <div class="s-hd">
        <span class="s-no">#${o.number}</span>
        <span class="s-pay ${o.payment === 'cash' ? 'cash' : 'card'}">${o.payment === 'cash' ? 'Para në dorë' : 'Me kartë'}</span>
        <span class="s-tot">${esc(money(o.total))}</span>
      </div>
      <div class="s-bd">
        <span class="s-name">${esc(o.customer_name)}</span>
        <span class="s-addr">${esc(o.address || '')}</span>
        ${o.note ? `<p class="s-note">📝 ${esc(o.note)}</p>` : ''}
      </div>
      ${gone ? '' : `<div class="s-act">
        <a class="sbtn s-nav" href="${esc(store.navLink(o))}" target="_blank" rel="noopener">🧭 Navigo</a>
        <a class="sbtn s-call" href="${esc(tel(o.phone))}">📞 Telefono</a>
        <button class="sbtn s-done wide" data-deliver="${esc(o.id)}">U dorëzua</button>
        <button class="sbtn s-fail wide" data-fail="${esc(o.id)}">Nuk u gjend / nuk përgjigjet</button>
      </div>`}
    </article>`;

    return head
      + left.map((o) => card(o, false)).join('')
      + (done.length ? `<div class="rsec"><h2>Dorëzuar — ${done.length}</h2></div>`
                        + done.map((o) => card(o, true)).join('') : '')
      + dayBox() + privacy();
  }

  function dayBox() {
    const d = R.day || { deliveries: 0, cash: 0, card: 0 };
    return `<div class="rsec" style="margin-top:.6rem">
      <h2>Sot</h2>
      <div class="daybox">
        <div><b>${d.deliveries || 0}</b><span>Dorëzime</span></div>
        <div><b>${esc(money(d.cash || 0))}</b><span>Para në dorë</span></div>
        <div><b>${esc(money(d.card || 0))}</b><span>Me kartë</span></div>
      </div>
    </div>`;
  }

  const privacy = () => `<p class="privacy">Gjatë nisjes regjistrohet vendndodhja
    kur nisesh dhe kur dorëzon — vetëm në ato çaste, dhe vetëm sa je në punë.
    Kjo shërben për të ditur sa zgjatin dorëzimet.</p>`;

  function render() {
    $('#v-runs').innerHTML = R.run ? renderRun() : renderPicking();
  }

  /* ---------- të dhënat ---------- */

  async function load(silent) {
    if (!R.live) return;
    try {
      const mine = await store.drvMyRun();
      S.staf.offline(false);
      R.run = mine.run; R.stops = mine.stops;
      if (!R.run) {
        R.ready = (await store.drvReady()) || [];
        // hiq nga zgjedhja çdo porosi që e mori dikush tjetër ndërkohë
        const ids = new Set(R.ready.map((o) => o.id));
        [...R.pick].forEach((id) => { if (!ids.has(id)) R.pick.delete(id); });
      }
      R.day = await store.drvMyDay().catch(() => null);
      render();
    } catch (e) {
      S.staf.offline(true);
      if (/kod|Hyr|esion/i.test(e.message)) S.staf.logout();
    }
  }

  async function startRun() {
    const ids = [...R.pick];
    if (!ids.length) return;
    const btn = $('#goRun');
    if (btn) { btn.disabled = true; btn.textContent = 'Po nisesh…'; }
    try {
      await store.drvStartRun(ids, await here());
      R.pick.clear();
      await load(true);
    } catch (e) {
      alert(e.message);
      await load(true);
    }
  }

  /* ---------- dorëzimi ---------- */

  function openDeliver(id) {
    const o = R.stops.find((x) => x.id === id);
    if (!o) return;
    R.target = o;
    $('#dlvTitle').textContent = 'Porosia #' + o.number;
    $('#dlvErr').textContent = '';
    const cash = o.payment === 'cash';
    $('#dlvSub').textContent = cash
      ? 'Sa para arkëtove? Lëre siç është nëse mori shumën e plotë.'
      : 'Kjo porosi është paguar me kartë — nuk arkëtohet gjë.';
    $('#dlvCashWrap').classList.toggle('hide', !cash);
    $('#dlvCash').value = cash ? String(Math.round(Number(o.total) || 0)) : '';
    $('#dlvModal').classList.add('on');
  }
  const closeDeliver = () => { $('#dlvModal').classList.remove('on'); R.target = null; };

  async function confirmDeliver() {
    const o = R.target;
    if (!o) return;
    const cash = o.payment === 'cash'
      ? Number(String($('#dlvCash').value).replace(/\D/g, '')) : null;
    $('#dlvOk').disabled = true;
    try {
      await store.drvDelivered(o.id, await here(), cash);
      closeDeliver();
      await load(true);
    } catch (e) {
      $('#dlvErr').textContent = e.message;
    } finally { $('#dlvOk').disabled = false; }
  }

  function openFail(id) {
    R.target = R.stops.find((x) => x.id === id) || null;
    if (R.target) $('#failModal').classList.add('on');
  }
  const closeFail = () => { $('#failModal').classList.remove('on'); R.target = null; };

  async function confirmFail() {
    const o = R.target;
    if (!o) return;
    try {
      await store.drvFailed(o.id, $('#failReason').value);
      closeFail();
      await load(true);
    } catch (e) { alert(e.message); }
  }

  /* ---------- lidhjet ---------- */

  document.addEventListener('click', (e) => {
    if (e.target.closest('[data-dlv-close]')) return closeDeliver();
    if (e.target.closest('[data-fail-close]')) return closeFail();
    if (e.target.id === 'dlvOk') return confirmDeliver();
    if (e.target.id === 'failOk') return confirmFail();
    if (!R.live) return;

    const pk = e.target.closest('[data-pickit]');
    if (pk) {
      const id = pk.dataset.pickit;
      if (R.pick.has(id)) R.pick.delete(id); else R.pick.add(id);
      render();
      return;
    }
    if (e.target.closest('#goRun')) return startRun();

    const d = e.target.closest('[data-deliver]');
    if (d) return openDeliver(d.dataset.deliver);

    const f = e.target.closest('[data-fail]');
    if (f) return openFail(f.dataset.fail);
  });

  S.views = S.views || {};
  S.views.runs = {
    label: 'Motorristi',
    start() {
      R.live = true;
      $('#v-runs').classList.remove('hide');
      load();
      clearInterval(R.poll);
      R.poll = setInterval(() => { if (!document.hidden) load(true); }, 12000);
    },
    stop() {
      R.live = false;
      clearInterval(R.poll);
      $('#v-runs').classList.add('hide');
    },
    refresh: () => load(true),
  };
})();

</script>
<script>
/* ============================================================================
   SPRINT — Guaska e aplikacionit të stafit.
   Një hyrje për të gjithë. Kodi vendos se cilat pamje hapen: kuzhinieri sheh
   furrën, motorristi sheh nisjen, pronari sheh të dyja dhe ndërron mes tyre.
   ========================================================================== */
(function () {
  const S = window.SPRINT;
  const store = S.store;
  const $ = (s) => document.querySelector(s);
  const esc = (t) => String(t == null ? '' : t)
    .replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

  // Pamjet që di ta hapë kjo faqe. Ekranet e tjera (porositë, menuja,
  // magazina) rrinë te paneli — këtu vijnë vetëm ato që përdoren në këmbë.
  const HERE = ['kds', 'runs'];

  const A = { me: null, view: null, poll: null };

  /* ══════════════════ HYRJA ══════════════════ */

  let pin = '';
  const showPin = () => { $('#pinShow').textContent = '•'.repeat(pin.length); };

  function gateErr(m) {
    $('#gateErr').textContent = m || '';
    if (m) {
      $('#pinShow').classList.add('err');
      setTimeout(() => $('#pinShow').classList.remove('err'), 320);
    }
  }

  async function tryLogin() {
    if (pin.length < 4) return gateErr('Kodi ka të paktën 4 shifra.');
    const code = pin;
    pin = ''; showPin();
    try {
      await store.staffLogin(code, 'staf');
      const me = await store.myScreens();
      if (!me) return gateErr('Sesioni nuk u hap. Provo sërish.');
      const mine = (me.screens || []).filter((s) => HERE.indexOf(s) >= 0);
      if (!mine.length) {
        await store.staffLogout();
        return gateErr('Ky kod nuk ka asnjë ekran këtu. Hyr te paneli me email.');
      }
      enter(me);
    } catch (e) {
      gateErr(e.message);
    }
  }

  $('.keys').addEventListener('click', (e) => {
    const b = e.target.closest('[data-k]');
    if (!b) return;
    gateErr('');
    const k = b.dataset.k;
    if (k === 'del') pin = pin.slice(0, -1);
    else if (k === 'ok') return tryLogin();
    else if (pin.length < 8) pin += k;
    showPin();
    if (pin.length === 8) tryLogin();
  });

  document.addEventListener('keydown', (e) => {
    if ($('#gate').classList.contains('hide')) return;
    if (/^[0-9]$/.test(e.key) && pin.length < 8) { pin += e.key; showPin(); gateErr(''); }
    else if (e.key === 'Backspace') { pin = pin.slice(0, -1); showPin(); }
    else if (e.key === 'Enter') tryLogin();
  });

  /* ══════════════════ PAMJET ══════════════════ */

  function setView(key) {
    if (A.view && S.views[A.view]) S.views[A.view].stop();
    A.view = key;
    document.querySelectorAll('#switcher button').forEach((b) =>
      b.classList.toggle('on', b.dataset.view === key));
    if (S.views[key]) S.views[key].start();
    try { localStorage.setItem('sprint-staf-view', key); } catch (e) {}
  }

  function enter(me) {
    A.me = me;
    const mine = (me.screens || []).filter((s) => HERE.indexOf(s) >= 0);

    $('#gate').classList.add('hide');
    $('#app').classList.remove('hide');
    $('#whoTxt').textContent = me.name + ' · ' + (store.STAFF_ROLES[me.role] || me.role);

    // Ndërruesi shfaqet vetëm kur ka vërtet ku të ndërrohet.
    const sw = $('#switcher');
    if (mine.length > 1) {
      sw.innerHTML = mine.map((k) =>
        `<button data-view="${esc(k)}">${esc((S.views[k] && S.views[k].label) || k)}</button>`).join('');
      sw.classList.remove('hide');
    } else {
      sw.innerHTML = ''; sw.classList.add('hide');
    }

    let want = null;
    try { want = localStorage.getItem('sprint-staf-view'); } catch (e) {}
    setView(mine.indexOf(want) >= 0 ? want : mine[0]);

    clearInterval(A.poll);
    A.poll = setInterval(() => {
      if (!document.hidden && A.view && S.views[A.view]) S.views[A.view].refresh();
    }, 8000);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && A.view && S.views[A.view]) S.views[A.view].refresh();
    });
  }

  async function logout() {
    clearInterval(A.poll);
    if (A.view && S.views[A.view]) S.views[A.view].stop();
    A.view = null; A.me = null;
    await store.staffLogout();
    pin = ''; showPin(); gateErr('');
    $('#app').classList.add('hide');
    $('#gate').classList.remove('hide');
  }

  /* ══════════════════ E PËRBASHKËT ══════════════════ */

  S.staf = {
    offline: (on) => $('#offline').classList.toggle('on', !!on),
    logout,
    me: () => A.me,
  };

  document.addEventListener('click', (e) => {
    const v = e.target.closest('#switcher button');
    if (v) return setView(v.dataset.view);
    if (e.target.closest('#outBtn')) return logout();
    if (e.target.closest('#refBtn') && A.view && S.views[A.view]) return S.views[A.view].refresh();
  });

  /* Pa bazë të vërtetë kjo faqe do të ishte një tastierë që nuk hap asgjë.
     Prandaj kodet shembull thuhen hapur — dhe vetëm atëherë. */
  function showDemoCodes() {
    if (store.configured || !store.DEMO_STAFF) return;
    const box = document.createElement('p');
    box.className = 'gate-sub';
    box.style.cssText = 'border:1px dashed var(--line);border-radius:12px;padding:.7rem;'
      + 'font-size:.82rem;line-height:1.6';
    box.innerHTML = '<b style="color:var(--gold)">Provë pa bazë të dhënash</b><br>'
      + store.DEMO_STAFF.map((s) =>
          `${esc(s.name)} · <b class="code">${esc(s.pin)}</b>`).join('<br>');
    document.querySelector('.gate-card').appendChild(box);
  }
  showDemoCodes();

  /* Sesioni i ruajtur e kalon hyrjen — pajisja nuk e shkruan kodin çdo turn. */
  store.myScreens().then((me) => {
    if (me && (me.screens || []).some((s) => HERE.indexOf(s) >= 0)) enter(me);
    else showPin();
  }).catch(() => showPin());
})();

</script>
