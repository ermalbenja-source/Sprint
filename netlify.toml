# ============================================================================
#  SPRINT — Fast Food & Pizza, Durrës
#  Konfigurimi i publikimit në Netlify.
# ============================================================================

[build]
  command = "node build.js"
  publish = "dist"

# Paneli i menaxhimit nuk duhet të dalë kurrë në Google.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Fotot e ngarkuara ruhen gjatë në cache.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# /admin pa vijë të pjerrët të çojë te paneli.
[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301
