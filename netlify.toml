# ============================================================================
#  SPRINT — Fast Food & Pizza, Durrës
#  Konfigurimi i publikimit në Netlify.
# ============================================================================

[build]
  command = "node build.js"
  publish = "dist"

# Paneli dhe ekrani i kuzhinës nuk duhet të dalin kurrë në Google.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store"

[[headers]]
  for = "/kuzhina/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(self), microphone=()"

# Fotot e ngarkuara ruhen gjatë në cache.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# /admin dhe /kuzhina pa vijë të pjerrët të çojnë te faqet e tyre.
[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

[[redirects]]
  from = "/kuzhina"
  to = "/kuzhina/"
  status = 301
